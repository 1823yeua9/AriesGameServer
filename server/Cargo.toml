[workspace]
resolver = "3"
members = ["crates/*"]
# codex owns platform (backend.py port); it keeps its own lock and target dir
exclude = ["platform"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aries-bits = { path = "crates/bits" }
aries-net = { path = "crates/net" }
aries-rep = { path = "crates/rep" }
aries-oracle = { path = "crates/oracle" }
aries-interp = { path = "crates/interp" }
aries-world = { path = "crates/world" }
aries-range = { path = "crates/range" }

aes = "0.8"
ghash = "0.5"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Media",
    "Win32_Security",
] }

[profile.release]
debug = 1
